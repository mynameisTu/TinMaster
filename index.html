    <script>
      // Defensive fix for environments where window.fetch has only a getter on Window.prototype
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          function getFetch() {
            return currentFetch;
          }
          function setFetch(fn) {
            currentFetch = fn;
          }

          // 1. Attach setter to Window.prototype if accessible
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          // 2. Attach setter along the prototype chain of window
          var p = window;
          while (p) {
            try {
              var desc = Object.getOwnPropertyDescriptor(p, 'fetch');
              if (desc && (desc.configurable || !desc.set)) {
                Object.defineProperty(p, 'fetch', {
                  get: getFetch,
                  set: setFetch,
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
            p = Object.getPrototypeOf(p);
          }

          // 3. Define directly on window
          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (err) {}

        // 4. Suppress unhandled TypeError if environment attempts illegal assignment
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf("Cannot set property fetch") !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
